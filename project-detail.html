<!doctype html>
<html lang="en" class="tw-dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>Project Details - Roberto Di Maria</title>
        <meta name="description" content="Detailed project information" />
        <link rel="shortcut icon" href="./new/assets/logo/logo.png" type="image/x-icon" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

        <link rel="stylesheet" href="new/css/tailwind-build.css" />
        <link rel="stylesheet" href="new/css/index.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
            integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- MathJax for LaTeX rendering -->
        <script>
            MathJax = {
                tex: {
                    inlineMath: [['$', '$'], ['\\(', '\\)']],
                    displayMath: [['$$', '$$'], ['\\[', '\\]']]
                }
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

        <script type="importmap">
            {
                "imports": {
                    "motion": "./assets/js/motion.js"
                }
            }
        </script>
    </head>
    <body>
        <a href="#main-content" class="skip-link">Skip to main content</a>

        <header class="site-header">
            <div class="site-header-inner">
                <a class="brand-link" href="index.html" data-magnetic data-magnetic-strength="5">
                    <span>Roberto Di Maria</span>
                </a>

                <div class="nav-menu-wrapper" id="collapsed-header-items">
                    <nav class="site-nav" aria-label="Primary">
                        <a class="header-links" href="about.html" data-magnetic data-magnetic-strength="5">About</a>
                        <a class="header-links" href="index.html#projects" data-magnetic data-magnetic-strength="5">Projects</a>
                        <a class="header-links" href="index.html#contact" data-magnetic data-magnetic-strength="5">Contact</a>
                    </nav>
                </div>

                <button
                    type="button"
                    class="mobile-menu-btn"
                    aria-label="menu"
                    aria-expanded="false"
                    aria-controls="collapsed-header-items"
                    id="collapse-btn"
                >
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <main id="main-content" class="page-main">
            <div class="sidebar-layout" id="detail-layout">
                <!-- 320px Sticky Design Sidebar TOC -->
                <nav class="toc-panel motion-init" id="toc-container" aria-label="Contents">
                    <p class="toc-heading">Contents</p>
                    <ul id="toc-list" class="toc-list">
                        <!-- TOC will be dynamically populated -->
                    </ul>
                </nav>

                <div class="content-column" style="gap: 1.75rem;">
                    <div class="motion-init" id="back-nav-wrap">
                        <a
                            href="index.html#projects"
                            class="apple-btn apple-btn-secondary"
                            data-magnetic
                            data-magnetic-strength="6"
                        >
                            <i class="bi bi-arrow-left" aria-hidden="true"></i>
                            <span>Back to Projects</span>
                        </a>
                    </div>

                    <article
                        id="project-detail"
                        class="bento-card detail-article-shell project-report motion-init"
                        aria-live="polite"
                    >
                        <p>Loading project details...</p>
                    </article>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="site-footer-inner">
                <div class="footer-brand-row">
                    <a href="index.html" class="footer-brand-link" data-magnetic data-magnetic-strength="5">
                        Roberto Di Maria
                    </a>
                    <div class="footer-socials">
                        <a
                            href="https://github.com/robertodimaria"
                            aria-label="Github"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer-social-link"
                            data-magnetic
                            data-magnetic-strength="6"
                        >
                            <i class="bi bi-github" aria-hidden="true"></i>
                        </a>
                        <a
                            href="https://www.linkedin.com/in/roberto-di-maria"
                            aria-label="Linkedin"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer-social-link"
                            data-magnetic
                            data-magnetic-strength="6"
                        >
                            <i class="bi bi-linkedin" aria-hidden="true"></i>
                        </a>
                        <a
                            href="mailto:dimaria.roberto@studium.unict.it"
                            aria-label="Email"
                            class="footer-social-link"
                            data-magnetic
                            data-magnetic-strength="6"
                        >
                            <i class="bi bi-envelope" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>

                <div class="footer-meta">
                    <span>Copyright &#169; 2024-2025 Roberto Di Maria</span>
                    <span>Mechanical Engineering Portfolio</span>
                </div>
            </div>
        </footer>

        <script src="./projectsData.js"></script>
        <script type="module">
            import {
                animateEntranceGroup,
                attach3DTiltAndSpotlight,
                attachMagneticPull,
                markMotionReady,
                setupHeader,
                setupScrollReveals,
                setupTocScrollSpy
            } from "./utils.js";

            markMotionReady();
            setupHeader();

            const urlParams = new URLSearchParams(window.location.search);
            const rawProjectId = urlParams.get("id");
            const projectId = rawProjectId ? rawProjectId.replace(/[^a-zA-Z0-9-]/g, "") : null;

            const project = typeof projectsData !== "undefined"
                ? projectsData.find((p) => p.id === projectId)
                : null;

            const detailDiv = document.getElementById("project-detail");
            const tocList = document.getElementById("toc-list");
            const tocContainer = document.getElementById("toc-container");
            const detailLayout = document.getElementById("detail-layout");
            const backNavWrap = document.getElementById("back-nav-wrap");

            if (project) {
                const titleElement = document.createElement("h1");
                titleElement.textContent = project.title;

                const contentDiv = document.createElement("div");
                contentDiv.innerHTML = project.fullContent;

                const reportImages = contentDiv.querySelectorAll("img");
                reportImages.forEach((img, idx) => {
                    img.decoding = "async";
                    if (idx > 0) {
                        img.loading = "lazy";
                    }
                });

                // Add 3D scroll reveal & spotlight surface to report figures beyond the first
                const figures = contentDiv.querySelectorAll("figure");
                figures.forEach((fig, idx) => {
                    fig.classList.add("bento-card");
                    fig.setAttribute("data-tilt-card", "");
                    fig.setAttribute("data-tilt-max", "3.5");
                    fig.setAttribute("data-tilt-scale", "1.01");

                    if (idx > 0) {
                        fig.classList.add("motion-init");
                    }
                });

                document.title = project.title + " - Roberto Di Maria";

                detailDiv.innerHTML = "";
                detailDiv.appendChild(titleElement);
                detailDiv.appendChild(contentDiv);

                const h2Elements = contentDiv.querySelectorAll("h2");

                if (h2Elements.length > 0) {
                    h2Elements.forEach((h2, index) => {
                        const sectionId = "section-" + index;
                        h2.id = sectionId;
                        h2.classList.add("project-section");

                        const li = document.createElement("li");
                        const a = document.createElement("a");
                        a.href = "#" + sectionId;
                        a.textContent = h2.textContent;

                        li.appendChild(a);
                        tocList.appendChild(li);
                    });

                    const sections = contentDiv.querySelectorAll(".project-section");
                    const tocLinks = tocList.querySelectorAll("a");
                    setupTocScrollSpy(sections, tocLinks);
                } else {
                    tocContainer.style.display = "none";
                    detailLayout.style.gridTemplateColumns = "1fr";
                }

                function typesetMath() {
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([detailDiv]).catch((err) =>
                            console.log("MathJax typeset error:", err)
                        );
                    }
                }

                if (window.MathJax) {
                    typesetMath();
                } else {
                    const mjScript = document.getElementById("MathJax-script");
                    if (mjScript) {
                        mjScript.addEventListener("load", typesetMath, { once: true });
                    }
                }
            } else {
                detailDiv.innerHTML = `
                    <h1>Project Not Found</h1>
                    <p>Sorry, the requested project could not be found.</p>
                    <a href="index.html#projects" class="apple-btn apple-btn-secondary" data-magnetic data-magnetic-strength="6">
                        <i class="bi bi-arrow-left" aria-hidden="true"></i>
                        <span>Return to Projects</span>
                    </a>
                `;
                tocContainer.style.display = "none";
                detailLayout.style.gridTemplateColumns = "1fr";
            }

            animateEntranceGroup([tocContainer, backNavWrap, detailDiv]);
            setupScrollReveals(detailDiv);
            attach3DTiltAndSpotlight(document);
            attachMagneticPull(document);
        </script>
    </body>
</html>
